<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04070b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2304070b'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%235cf2c4'/%3E%3C/svg%3E">
  <title>PULSE</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070b;color:#eaf4f2;font-family:Inter,system-ui,sans-serif}
    #unity-canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 40% 45%,#0e2228,transparent 65%),#04070b;transition:opacity .2s}
    .loading-inner{width:280px;text-align:center}.wordmark{font-size:32px;font-weight:650;letter-spacing:.38em;margin:0 0 12px 12px}.tagline{color:#8fa6a8;font-size:13px;margin-bottom:38px}
    .track{height:2px;background:#164a40;margin:0 20px}#progress{height:2px;width:0;background:#5cf2c4;transition:width .15s}
    #message{color:#8fa6a8;font-size:11px;letter-spacing:.13em;line-height:1.7;margin:18px 0}#retry{display:none;background:none;border:1px solid #2fb894;color:#5cf2c4;padding:12px 24px;border-radius:8px;cursor:pointer}
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="PULSE cooperative tap game. Click TAP or press Space to charge the shared orb."></canvas>
  <div id="loader"><div class="loading-inner"><h1 class="wordmark">PULSE</h1><div class="track"><div id="progress"></div></div><p id="message" role="status">LOADING · 0%</p><button id="retry" onclick="location.reload()">RELOAD</button></div></div>
  <script>
    const canvas=document.getElementById('unity-canvas');
    const fail=error=>{window.__pulseLoadError=String(error);document.getElementById('message').textContent="Couldn't load the game. Reload to try again.";document.getElementById('message').style.color='#ff6b5a';document.getElementById('retry').style.display='inline-block';console.error(error)};
    const script=document.createElement('script');
    script.src='Build/{{{ LOADER_FILENAME }}}';
    script.onerror=()=>fail('Unity loader could not be downloaded.');
    script.onload=()=>createUnityInstance(canvas,{
      dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl:'StreamingAssets',companyName:'OneDeploy Demo',productName:'PULSE',productVersion:'0.1.0',
      devicePixelRatio:Math.min(window.devicePixelRatio||1,2)
    },progress=>{document.getElementById('progress').style.width=(progress*100)+'%';document.getElementById('message').textContent='LOADING · '+Math.round(progress*100)+'%'}).then(instance=>{
      window.unityInstance=instance;
      const loader=document.getElementById('loader');loader.style.opacity=0;setTimeout(()=>loader.remove(),220);canvas.focus();
    }).catch(fail);
    document.body.appendChild(script);
    window.addEventListener('keydown',e=>{if(e.code==='Space')e.preventDefault()});
  </script>
</body>
</html>
