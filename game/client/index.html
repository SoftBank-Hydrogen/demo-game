<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04070b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2304070b'/%3E%3Cpath d='M14 32a18 18 0 0 0 36 0z' fill='%235cf2c4'/%3E%3Cpath d='M14 32a18 18 0 0 1 36 0z' fill='%23ffb547'/%3E%3C/svg%3E">
  <title>PULSE TUG</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070b;color:#eaf4f2;font-family:Inter,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    #unity-canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,#0e2228,transparent 65%),#04070b;transition:opacity .2s}
    .loading-inner{width:280px;text-align:center}.wordmark{font-size:30px;font-weight:650;letter-spacing:.32em;margin:0 0 30px 10px}
    .wordmark .a{color:#5cf2c4}.wordmark .b{color:#ffb547}
    .track{height:2px;background:#164a40;margin:0 20px}#progress{height:2px;width:0;background:linear-gradient(90deg,#5cf2c4,#ffb547);transition:width .15s}
    #message{color:#8fa6a8;font-size:11px;letter-spacing:.13em;line-height:1.7;margin:18px 0}#retry{display:none;background:none;border:1px solid #2fb894;color:#5cf2c4;padding:12px 24px;border-radius:8px;cursor:pointer}
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="PULSE TUG team tap battle. Tap or press Space during a round."></canvas>
  <div id="loader"><div class="loading-inner"><h1 class="wordmark"><span class="a">PULSE</span> <span class="b">TUG</span></h1><div class="track"><div id="progress"></div></div><p id="message" role="status">LOADING · 0%</p><button id="retry" onclick="location.reload()">RELOAD</button></div></div>
  <script>
    window.GAME_SERVER = "ws://localhost:8080/ws";
  </script>
  <script>
    const canvas=document.getElementById('unity-canvas');
    const fail=error=>{window.__tugLoadError=String(error);document.getElementById('message').textContent="Couldn't load the game. Reload to try again.";document.getElementById('message').style.color='#ff6b5a';document.getElementById('retry').style.display='inline-block';console.error(error)};
    const script=document.createElement('script');
    script.src='Build/client.loader.js';
    script.onerror=()=>fail('Unity loader could not be downloaded.');
    script.onload=()=>createUnityInstance(canvas,{
      dataUrl:'Build/client.data.unityweb',frameworkUrl:'Build/client.framework.js.unityweb',codeUrl:'Build/client.wasm.unityweb',
      streamingAssetsUrl:'StreamingAssets',companyName:'OneDeploy Demo',productName:'PULSE TUG',productVersion:'0.1.0',
      devicePixelRatio:Math.min(window.devicePixelRatio||1,2)
    },progress=>{document.getElementById('progress').style.width=(progress*100)+'%';document.getElementById('message').textContent='LOADING · '+Math.round(progress*100)+'%'}).then(instance=>{
      window.unityInstance=instance;
      const loader=document.getElementById('loader');loader.style.opacity=0;setTimeout(()=>loader.remove(),220);canvas.focus();
    }).catch(fail);
    document.body.appendChild(script);
    window.addEventListener('keydown',e=>{if(e.code==='Space')e.preventDefault()});
  </script>
</body>
</html>
